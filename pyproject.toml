[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "galaxi"
version = "0.1.0"
description = "General Automated Learning and Analysis for X-ray diffraction Identification"
readme = "README.md"
authors = [
    {name = "Nathan Szymanski", email = "nszymanski@seas.ucla.edu"},
]
license = {text = "MIT"}
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Chemistry",
]
keywords = ["xrd", "crystallography", "materials-science", "deep-learning", "machine-learning"]
requires-python = ">=3.10"
# Exact environment used for every result reported in the manuscript
# (recorded by Weights & Biases at training time, May-June 2026):
#   Python 3.10.20
#   torch 2.12.0.dev20260407+cu128      pymatgen 2025.10.7
#   numpy 2.2.6                         scipy 1.15.3
#   scikit-learn 1.7.2                  pandas 2.3.3
#   h5py 3.16.0                         ray 2.55.1
#   dara-xrd 1.1.4 (pinned to a commit below)
# Baseline models were run separately under TensorFlow 2.21.0 with Keras 3.12.3.
# GPU: NVIDIA RTX PRO 6000 Blackwell Max-Q.
dependencies = [
    "numpy==2.2.6",
    "matplotlib==3.10.9",
    # Results in the manuscript were produced with the CUDA 12.8 nightly
    # torch 2.12.0.dev20260407+cu128 recorded in the block above. That build
    # is not resolvable from PyPI by version alone, so the floor is left open.
    "torch>=2.0",
    "scipy==1.15.3",
    "pymatgen==2025.10.7",
    "scikit-learn==1.7.2",
    "scikit-image>=0.18.0",
    "pyxtal>=0.5.0",
    "gdown>=4.0.0",
    "tqdm>=4.0.0",
    "pathlib2>=2.3.0; python_version<'3.4'",
    "seaborn",
    "adabelief-pytorch",
    "zarr",
    "pandas==2.3.3",
    "plotly",
    "h5py==3.16.0",
    # DARA is pinned to a fork rather than the upstream release: GALAXI's
    # DaraConfig uses the "gaussian_cosine" phase-grouping metric, which this
    # fork provides. The pin is exact so refinement results stay reproducible.
    # Note the distribution is named "dara-xrd" while the import is "dara".
    "dara-xrd @ git+https://github.com/cuzno200161/dara.git@e95eace9a6e90bc17c491f2b1b1a4404906d4027",
]

[project.optional-dependencies]
dev = [
    "pytest>=6.0",
    "black>=22.0",
    "isort>=5.0",
    "flake8>=4.0",
]

[project.urls]
"Homepage" = "https://github.com/Szymanski-Group/galaxi"
"Bug Tracker" = "https://github.com/Szymanski-Group/galaxi/issues"
"Source Code" = "https://github.com/Szymanski-Group/galaxi"

[project.scripts]
galaxi-workflow = "galaxi.workflows.streamlined_workflow:main"
galaxi-generate-test = "galaxi.scripts.generate_test_patterns:main"
galaxi-setup-cod = "galaxi.scripts.setup_cod:main"
galaxi-setup-bg-profiles = "galaxi.scripts.setup_bg_profiles:main"
galaxi-query-cod = "galaxi.scripts.query_cod:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 88
target-version = ["py38"]
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 88

[tool.pytest]
testpaths = ["tests"]
python_files = ["test_*.py"]
